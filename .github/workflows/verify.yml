name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Native MySQL provided by the runner image. No service containers.
      - name: Prepare native test database
        env:
          MYSQL_PWD: root
        run: |
          sudo systemctl start mysql.service
          mysql -h 127.0.0.1 -u root <<'SQL'
          CREATE DATABASE review_workspace_test CHARACTER SET utf8mb4;
          CREATE USER 'review_ci'@'127.0.0.1' IDENTIFIED BY 'RunnerOnly_2026';
          GRANT ALL PRIVILEGES ON review_workspace_test.* TO 'review_ci'@'127.0.0.1';
          SQL
      - name: Prepare native preview converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-liberation fonts-noto-cjk
      - name: Backend verification
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/review_workspace_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true
          DB_USERNAME: review_ci
          DB_PASSWORD: RunnerOnly_2026
          AI_ENABLED: 'false'
          CONVERTER_PATH: /usr/bin/libreoffice
        run: bash backend/mvnw -B -ntp -f backend/pom.xml verify
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
