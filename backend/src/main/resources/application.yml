server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}
  tomcat:
    max-swallow-size: 24MB
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: review-workspace
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/review_workspace?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:review_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
app:
  search:
    root: ${INDEX_ROOT:.runtime/index}
  material:
    storage-root: ${STORAGE_ROOT:.runtime/data}
    converter: ${CONVERTER_PATH:}
    convert-timeout-seconds: ${CONVERT_TIMEOUT_SECONDS:120}
  jobs:
    enabled: ${JOB_WORKER_ENABLED:true}
  ai:
    enabled: ${AI_ENABLED:false}
    key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    daily-limit: ${AI_DAILY_REQUEST_LIMIT:0}
    vision-enabled: ${AI_VISION_ENABLED:false}
logging:
  level:
    root: INFO
